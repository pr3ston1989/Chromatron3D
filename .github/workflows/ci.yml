name: Browser prototype validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
# Only validate the newest commit on a branch. The optics GPU tests take time;
# overlapping old runs waste compute and delay feedback.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run optical, puzzle and localization tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser UI and screenshots
        run: npm run test:e2e
      - name: Publish screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromatron-browser-review
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
