name: Browser prototype validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run optical, puzzle and localization tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser UI and screenshots
        run: npm run test:e2e
      - name: Publish screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromatron-browser-review
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Smoke test rendered 3D puzzle and localization
        run: npm run test:browser
      - name: Attach browser screenshots for visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-smoke-test
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
